name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node setup ─────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      # ── WASM files ─────────────────────────────────────────────────────────
      # planner.js and planner.wasm are committed in web/src/wasm/bin/.
      # Vite serves files from web/public/ as static assets at the root of the
      # base URL, so we copy them there before building.
      - name: Copy WASM artifacts to public/
        run: |
          cp web/src/wasm/bin/planner.js  web/public/planner.js
          cp web/src/wasm/bin/planner.wasm web/public/planner.wasm

      # ── Vite production build ───────────────────────────────────────────────
      - name: Build
        run: npm run build
        working-directory: web

      # ── GitHub Pages upload / deploy ────────────────────────────────────────
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
